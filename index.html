<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL ACCESS</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: black;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: crosshair;
        }

        #overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        .content {
            text-align: center;
            border: 1px solid #00FF00;
            padding: 50px;
        }

        input {
            background: transparent;
            border: 1px solid #00FF00;
            color: #00FF00;
            padding: 10px;
            text-align: center;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Layar Klik Pertama -->
    <div id="overlay" onclick="startFullScreen()">
        <h1>CLICK ANYWHERE TO START SYSTEM</h1>
    </div>

    <!-- Konten Utama (Tersembunyi) -->
    <div class="content">
        <h2 style="color: red;">[ SYSTEM LOCKED BY RANSOMWARE ]</h2>
        <p>Your files have been encrypted. Enter password to decrypt.</p>
        <input type="password" id="pass" placeholder="Enter Password" autofocus>
    </div>

    <script>
        function startFullScreen() {
            let elem = document.documentElement;

            // Masuk ke Mode Full Screen
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }

            // Sembunyikan Overlay Klik
            document.getElementById('overlay').style.display = 'none';
            
            // Kunci Mouse (Pointer Lock)
            elem.requestPointerLock();
        }

        // Cek Password (Password: 1234)
        document.getElementById('pass').addEventListener('keyup', function(e) {
            if (e.key === "Enter") {
                if (this.value === "1234") {
                    alert("Access Granted!");
                    document.exitFullscreen();
                    location.reload(); 
                } else {
                    alert("Wrong Password!");
                    this.value = "";
                }
            }
        });

        // Cegah klik kanan agar tidak bisa inspect element dengan mudah
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
